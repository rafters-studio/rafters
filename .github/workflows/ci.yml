name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The merge queue runs CI on the merge_group ref. Without this trigger no
  # check ever reports inside the queue, so a queued PR merges with its own
  # pull_request run still in flight (#2214 merged that way).
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The official Playwright image ships all three engines and their system
    # libraries, so no browser download or apt install runs here (#2837).
    # --with-deps used to fetch about 140 apt packages each run, and a slow
    # Ubuntu mirror held the job for over half an hour. The tag must equal the
    # lockfile's @playwright/test version; the first step checks that.
    # --user 1001 follows Playwright's GitHub Actions container example
    # (https://playwright.dev/docs/ci) and keeps Firefox off the root-HOME path.
    container:
      image: &playwright-image mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - &check-playwright-image
        name: Check the Playwright image matches the lockfile
        env:
          PLAYWRIGHT_IMAGE: *playwright-image
        run: |
          image_version="${PLAYWRIGHT_IMAGE##*:v}"
          image_version="${image_version%-noble}"
          lock_version="$(sed -n "s/^  '@playwright\/test@\([^']*\)':\$/\1/p" pnpm-lock.yaml | head -n 1)"
          if [ "$image_version" != "$lock_version" ]; then
            echo "Playwright image is v$image_version but pnpm-lock.yaml has @playwright/test $lock_version; update the image tag in .github/workflows/ci.yml"
            exit 1
          fi
          echo "Playwright image v$image_version matches @playwright/test $lock_version"
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # All three engines the root playwright.config.ts declares projects for
      # come from the image. webkit is not optional:
      # test/presence/presence-race.e2e.ts is the only place the browser
      # semantics usePresence rests on are measured, and it is measured in
      # every engine the project ships against.
      - run: pnpm test:all

  # The Astro matrix (#2327): the same packages/ui Astro test files and
  # `astro check` against each Astro major the consumers run. One matrix
  # entry per leg, fail-fast off, so each reports as its own check and
  # neither masks the other. The 7 leg is the workspace pin (its tests also
  # run inside `test` above; this adds `astro check`). The 6 leg is an
  # isolated install under packages/ui/test/astro-matrix/v6 with its own
  # lockfile; the workspace install is still needed there because the
  # component sources import workspace packages and the test files import
  # the shared test tooling.
  astro:
    name: astro-${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same Playwright image as the test job; the Astro layout specs measure
    # the markup in its Chromium.
    container:
      image: *playwright-image
      options: --user 1001
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: 7
            test: test:astro
            check: check:astro
          - leg: 6
            test: test:astro:v6
            check: check:astro:v6
    steps:
      - uses: actions/checkout@v5
      - *check-playwright-image
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rafters/ui ${{ matrix.test }}
      - run: pnpm --filter @rafters/ui ${{ matrix.check }}
