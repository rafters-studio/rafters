name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The merge queue runs CI on the merge_group ref. Without this trigger no
  # check ever reports inside the queue, so a queued PR merges with its own
  # pull_request run still in flight (#2214 merged that way).
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # All three engines the root playwright.config.ts declares projects for.
      # webkit is not optional: test/presence/presence-race.e2e.ts is the only
      # place the browser semantics usePresence rests on are measured, and it is
      # measured in every engine the project ships against.
      #
      # --with-deps runs apt-get update against the runner's Google Chrome
      # source, which has twice answered with a Hash Sum mismatch from
      # dl.google.com and failed the job before a single test ran. A mismatch
      # means the cached package index disagrees with the mirror mid-update, so
      # a bare retry would re-read the same bad index; each attempt drops
      # /var/lib/apt/lists to force a clean refetch. The first attempt neither
      # clears nor sleeps, so a healthy run costs nothing extra (#2342).
      - name: Install Playwright engines and system dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium firefox webkit; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "playwright install failed (attempt $attempt of 3); clearing the apt index and retrying"
              sudo rm -rf /var/lib/apt/lists/*
              sleep 15
            fi
          done
          echo "playwright install failed after 3 attempts"
          exit 1
      - run: pnpm test:all

  # The Astro matrix (#2327): the same packages/ui Astro test files and
  # `astro check` against each Astro major the consumers run. One matrix
  # entry per leg, fail-fast off, so each reports as its own check and
  # neither masks the other. The 7 leg is the workspace pin (its tests also
  # run inside `test` above; this adds `astro check`). The 6 leg is an
  # isolated install under packages/ui/test/astro-matrix/v6 with its own
  # lockfile; the workspace install is still needed there because the
  # component sources import workspace packages and the test files import
  # the shared test tooling.
  astro:
    name: astro-${{ matrix.leg }}
    runs-on: ubuntu-latest
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: 7
            test: test:astro
            check: check:astro
          - leg: 6
            test: test:astro:v6
            check: check:astro:v6
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rafters/ui ${{ matrix.test }}
      - run: pnpm --filter @rafters/ui ${{ matrix.check }}
