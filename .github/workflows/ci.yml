name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # All three engines the root playwright.config.ts declares projects for.
      # webkit is not optional: test/presence/presence-race.e2e.ts is the only
      # place the browser semantics usePresence rests on are measured, and it is
      # measured in every engine the project ships against.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:all
