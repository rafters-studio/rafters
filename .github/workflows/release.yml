name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter=rafters build

      - name: Publish to npm
        run: npm publish --access=public --provenance
        working-directory: packages/cli

      - name: Publish @rafters/math-utils to npm
        run: pnpm publish --access=public --provenance --no-git-checks
        working-directory: packages/math-utils

      - name: Publish @rafters/shared to npm
        run: pnpm publish --access=public --provenance --no-git-checks
        working-directory: packages/shared

      - name: Publish @rafters/color-utils to npm
        run: pnpm publish --access=public --provenance --no-git-checks
        working-directory: packages/color-utils

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
