# Pre-commit hook: Fast checks (target <30s)
pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: pnpm biome check --write {staged_files} || [ $? -eq 1 ]
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
    unit-tests:
      glob: "*.{ts,tsx}"
      run: |
        packages=$(echo "{staged_files}" | tr ' ' '\n' | \
          grep -E '^(apps|packages)/' | \
          sed 's|^\(apps/[^/]*\).*|\1|; s|^\(packages/[^/]*\).*|\1|' | \
          sort -u)

        if [ -z "$packages" ]; then
          echo "No workspace packages changed"
          exit 0
        fi

        echo "Testing packages:"
        echo "$packages" | sed 's/^/  - /'

        for pkg_path in $packages; do
          pkg_name=$(grep -oP '"name":\s*"\K[^"]+' "$pkg_path/package.json" 2>/dev/null)
          if [ -n "$pkg_name" ]; then
            echo "Running tests for $pkg_name..."
            pnpm --filter "$pkg_name" test:unit --run || exit 1
          fi
        done

# Pre-push hook: Full validation (target <5min)
pre-push:
  parallel: false
  commands:
    scip-freshness:
      # index.scip is tracked and goes stale silently (#1633); a stale index
      # makes `legion sym` lie and every concurrent branch conflict on the
      # binary. Lockfile semantics: regenerate, compare, reject the push if
      # it was stale -- the fresh file is left in the worktree so the fix is
      # commit-and-push-again.
      priority: 1
      run: |
        if ! command -v legion >/dev/null 2>&1; then
          echo "legion not found; skipping index.scip freshness check"
          exit 0
        fi
        legion index rafters >/dev/null 2>&1 || true
        if ! git diff --quiet -- index.scip; then
          echo ""
          echo "index.scip was STALE (#1633). It has been regenerated for you."
          echo "Commit the fresh index and push again:"
          echo "  git add index.scip && git commit -m 'chore: refresh index.scip' && git push"
          exit 1
        fi
        echo "index.scip fresh"
    preflight:
      priority: 2
      run: pnpm preflight
