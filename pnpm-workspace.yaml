packages:
  - apps/*
  - packages/*

# Build-script decisions (pnpm 11 allowBuilds, replaces onlyBuiltDependencies).
# false = binaries arrive via optional platform deps; the postinstall is redundant.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lefthook: true
  msw: false
  sharp: false
  vue-demi: true
  workerd: false

catalog:
  '@axe-core/playwright': ^4.11.0
  # @vitest/browser-playwright dev-pins playwright ^1.62.1; keep the runner in step.
  '@playwright/test': ^1.62.1
  '@testing-library/jest-dom': ^6.6.3
  '@testing-library/react': ^16.1.0
  '@testing-library/user-event': ^14.5.2
  '@types/node': 24.10.0
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  '@vitejs/plugin-react': ^6.0.0
  # Vitest moves as one block: every first-party companion peers on the exact
  # vitest version it ships with, so a partial bump does not resolve.
  '@vitest/browser-playwright': ^5.0.0
  '@vitest/coverage-v8': ^5.0.0
  '@vitest/ui': ^5.0.0
  axe-core: ^4.11.0
  comment-parser: ^1.4.1
  esbuild: ^0.27.3
  happy-dom: ^20.0.10
  hono: 4.11.0
  lefthook: ^1.10.0
  lit: ^3.3.1
  msw: ^2.11.6
  playwright-bdd: ^8.4.2
  react: ^19.2.0
  react-dom: ^19.2.0
  stoker: ^2.0.1
  typescript: 5.9.3
  vitest: ^5.0.0
  vitest-axe: ^1.0.0-pre.3
  vitest-browser-react: ^2.3.0
  zocker: 3.0.0
  zod: ^4.1.12
