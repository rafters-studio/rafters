packages:
  - apps/*
  - packages/*

# Build-script decisions (pnpm 11 allowBuilds, replaces onlyBuiltDependencies).
# false = binaries arrive via optional platform deps; the postinstall is redundant.
allowBuilds:
  esbuild: false
  msw: false

# Vitest 5 creates os.tmpdir()/<nanoid> for its core module fetcher and never
# removes it, leaking one dir per run (still true in 5.0.2). The patch removes
# it in Vitest.close(). Drop it once upstream cleans _tmpDir on close.
patchedDependencies:
  vitest@5.0.0: patches/vitest@5.0.0.patch

# Shared versions come from @rafters/toolchain (configDependencies below, applied by
# .pnpmfile.mjs). An entry here wins over the toolchain's, so this block holds only
# packages the toolchain does not manage.
catalog:
  "@rafters/toolchain": ^0.1.6
  "@axe-core/playwright": ^4.11.0
  "@playwright/test": ^1.62.1
  "@testing-library/jest-dom": ^6.6.3
  "@testing-library/react": ^16.1.0
  happy-dom: ^20.0.10
  msw: ^2.11.6
  react: ^19.2.0
  react-dom: ^19.2.0
  vitest: ^5.0.0
  zocker: 3.0.0

configDependencies:
  "@rafters/toolchain": 0.1.6

minimumReleaseAgeExclude:
  - "@rafters/toolchain"
